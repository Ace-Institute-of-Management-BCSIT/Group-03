<!DOCTYPE html>

<head>

    <title>NGO Dashboard - CareConnect</title>

</head>
<body>

<header>
    <a href="index.html" class="logo">CareConnect</a>

<h1>NGO Dashboard</h1>

<div id="ngo-profile">
    <h2>My Profile</h2>

    <p><b>Name:</b> <span id="ngo-name"></span></p>
    <p><b>Email:</b> <span id="ngo-email"></span></p>

    <input type="text" id="ngo-org" placeholder="Organization Name">
    <button onclick="updateNGOProfile()">Update Profile</button>
</div>

<!-- REQUEST SECTION (placeholder for future) -->
<div>
    <h2>Requests</h2>
    <p>NGO requests system will go here.</p>
</div>
